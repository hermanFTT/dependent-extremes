# =============================================================================
# Slurm profile for pitman_closeness.smk on Aalto Triton.
#
# Sibling of profiles/slurm/ (dedicated to bias_sensitivity.smk). Kept as a
# separate file because the two workflows have very different per-job costs:
# pitman_closeness's grid is one job per true-shape value (`n_k`, currently
# 20 in config/pitman_closeness.yaml), each doing plain point estimation
# with no coverage/credible-interval step -- much cheaper than a
# bias_sensitivity cell (n_rep up to 10000, coverage: true, 3 approaches).
#
# Rules covered: run_grid_point, combine, figures.
#
#   snakemake -s pitman_closeness.smk --profile profiles/slurm_pitman/ --cores 2
#
# See:
#   https://snakemake.readthedocs.io/en/stable/snakefiles/rules.html#standard-resources
#   https://scicomp.aalto.fi/triton/tut/slurm/
# =============================================================================

# Tell snakemake to use Slurm
executor: slurm

# Max number of Slurm jobs snakemake keeps submitted/queued at once.
#
# config/pitman_closeness.yaml currently has n_k: 20 -> 20 `run_grid_point`
# jobs (+ combine + figures). You mentioned scaling the grid up later in
# that file -- raise `jobs` together with `n_k` (e.g. to a few hundred if
# `n_k` grows into the hundreds), keeping it under Triton's per-user
# job/QOS limits (`sacctmgr show user $USER withassoc` if unsure). 50 is
# already generous headroom over the current default of 20.
jobs: 50

# Resubmit a failed job with more mem/runtime (see set-resources below)
# instead of giving up immediately.
retries: 2

# Triton's shared filesystem can lag behind job completion; wait this long
# for expected output files to show up before declaring a job failed.
latency-wait: 60

# Keep computing the rest of the grid even if a handful of points fail
# outright after all retries.
keep-going: true

# Default resources for every rule (overridden per rule below).
default-resources:
  slurm_partition: batch
  mem_mb: 500
  runtime: 10          # minutes

# "threads" == Slurm's "cpus-per-task". `run_grid_point`'s threads come from
# `threads_per_job` in config/pitman_closeness.yaml (kept at 1 there).
# With only `n_k` grid points -- cheap and embarrassingly parallel -- Slurm
# generally makes better use of a shared cluster by spreading cores across
# MORE jobs (raise `jobs`/`n_k`) than by giving each single point several
# cores. bias_sensitivity.smk's `run_cell` currently takes the opposite
# trade-off (8 cores/cell, fewer heavier jobs) -- bump this the same way
# (and raise `run_grid_point`'s mem_mb below) if you'd rather do that here
# too once you scale up n_k.
set-threads:
  run_grid_point: 1
  combine: 1
  figures: 1

# Per-rule memory / walltime.
#
# `run_grid_point` simulates + fits S replicates at ONE true-shape value,
# with no coverage/credible-interval step -- much lighter than
# bias_sensitivity's run_cell. Sized with headroom above the current config
# (n_k=20, n_rep=5000, n_obs=4000; closeness_efficiency.md measured ~2 min
# total for n_k=20, S=1000, n=2000 on 16 cores). Raise these if you scale
# n_rep/n_obs up in config/pitman_closeness.yaml -- scaling n_k alone just
# means more jobs of the same size, not bigger ones.
set-resources:
  run_grid_point:
    mem_mb: 1000
    runtime: 30
  combine:
    # reads all n_k raw/pc_*.rds files into one table -- tiny even with
    # n_k in the hundreds
    mem_mb: 500
    runtime: 10
  figures:
    mem_mb: 500
    runtime: 10
