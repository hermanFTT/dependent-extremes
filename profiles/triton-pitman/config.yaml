# =============================================================================
# Snakemake profile: pitman_closeness.smk on Triton (Slurm).
#
#   source triton/env.sh
#   snakemake -s pitman_closeness.smk --profile profiles/triton-pitman -n  # dry
#   snakemake -s pitman_closeness.smk --profile profiles/triton-pitman     # go
#
# Identical to profiles/triton-bias except for the job count and the name of
# the per-unit rule (`run_grid_point` here, `run_cell` there).
# =============================================================================

executor: slurm

# --- scale ------------------------------------------------------------------
# One job per grid point: config n_k = 20.
jobs: 24

latency-wait: 60

retries: 2
keep-going: true
rerun-incomplete: true
printshellcmds: true

# --- resources --------------------------------------------------------------
# runtime in MINUTES, mem_mb in MB.
default-resources:
  runtime: 30
  mem_mb: 2000

set-resources:
  # n_rep=5000 at n_obs=4000, dep="markov" (POT::simmc per replicate).
  # MEASURED: S=200 = 8.2 s, peak RSS 112 MB  =>  S=5000 ~ 3.5 min, ~120 MB.
  run_grid_point:
    runtime: 30
    mem_mb: 2000
  combine:
    runtime: 20
    mem_mb: 4000
  figures:
    runtime: 20
    mem_mb: 4000
