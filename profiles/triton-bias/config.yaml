# =============================================================================
# Snakemake profile: bias_sensitivity.smk on Triton (Slurm).
#
#   source triton/env.sh
#   snakemake -s bias_sensitivity.smk --profile profiles/triton-bias -n   # dry
#   snakemake -s bias_sensitivity.smk --profile profiles/triton-bias      # go
#
# Keys are long-form command-line flags without the leading "--".
#
# NOTE: this profile is workflow-specific because `set-resources` names rules.
# bias_sensitivity.smk has `run_cell`; pitman_closeness.smk has
# `run_grid_point`. Use profiles/triton-pitman for the latter.
# =============================================================================

executor: slurm

# --- scale ------------------------------------------------------------------
# The grid is dep_par x k_grid x n_obs x run_len = 19 x 2 x 2 x 1 = 76 cells,
# all independent. Allow them all in flight at once.
jobs: 80

# --- shared filesystem ------------------------------------------------------
# Triton's home/WRKDIR are shared network filesystems, so no storage plugin is
# needed; just allow for metadata latency after a job writes its output.
latency-wait: 60

# --- robustness -------------------------------------------------------------
# POT::simmc() occasionally fails with a root-finding error. The R code already
# retries internally, but a couple of Slurm-level retries costs nothing.
retries: 2
keep-going: true          # one bad cell must not stall the other 75
rerun-incomplete: true
printshellcmds: true

# --- resources --------------------------------------------------------------
# runtime is in MINUTES. mem_mb in MB.
# Neither .smk declares resources, so everything is supplied here.
default-resources:
  runtime: 30
  mem_mb: 2000

set-resources:
  # One Monte-Carlo cell at the current config (n_rep=5000, n_obs=4000,
  # coverage=true, n_draws=10000, all three approaches).
  # MEASURED: 500 reps = 21.7 s and peak RSS 115 MB, flat in n_rep
  #        => 5000 reps ~ 4 min, ~120 MB. Timing is uniform across the grid
  #           (dep_par 0.1/0.5/1 x k -0.3/0.3 all within 1.2-1.3 s at S=20).
  # 30 min / 2 GB is ~7x time and ~16x memory headroom. Do NOT inflate these:
  # short, small requests backfill far sooner on a busy cluster.
  run_cell:
    runtime: 30
    mem_mb: 2000
  # Loads all 76 .rds files at once and rbinds them -> memory, not time.
  combine:
    runtime: 20
    mem_mb: 4000
  figures:
    runtime: 20
    mem_mb: 4000

# `threads:` in the rules (from config `threads_per_job`) is mapped to
# Slurm --cpus-per-task automatically. Do NOT set cpus_per_task here.

# Let Slurm pick the partition from the runtime/memory request. Uncomment to
# force one:
# default-resources:
#   slurm_partition: batch
